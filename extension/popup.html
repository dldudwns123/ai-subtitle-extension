<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 발음 자막</title>
  <style>
    body {
      width: 240px;
      padding: 15px;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      margin: 0;
      background-color: #ffffff;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #333;
      border-bottom: 2px solid #00a2ff;
      padding-bottom: 8px;
    }
    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #444;
    }
    .slider-section {
      border-top: 1px solid #eee;
      padding-top: 10px;
      margin-bottom: 10px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #444;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .slider-input {
      width: 100%;
      cursor: pointer;
      accent-color: #00a2ff;
    }
    .lang-select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      outline: none;
      background-color: #fff;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .lang-select:focus {
      border-color: #00a2ff;
    }
    .download-section {
      border-top: 1px solid #eee;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .download-btn {
      width: 100%;
      padding: 9px 0;
      background-color: #00a2ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .download-btn:hover { background-color: #0082cc; }
    .download-btn.secondary { background-color: #4caf50; }
    .download-btn.secondary:hover { background-color: #388e3c; }
    .download-btn.mp3 { background-color: #ff5722; }
    .download-btn.mp3:hover { background-color: #e64a19; }
  </style>
</head>
<body>
  <h3>AI 자막 설정 & 다운로드</h3>
  
  <!-- 자막 표시 ON/OFF 토글 영역 -->
  <div class="toggle-group">
    <div class="toggle-item">
      <span>전체 자막 표시</span>
      <input type="checkbox" id="toggleSubtitle" checked>
    </div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 2px 0;">
    <div class="toggle-item">
      <span>외국어 원문</span>
      <input type="checkbox" id="toggleOriginal" checked>
    </div>
    <div class="toggle-item">
      <span>연음 발음</span>
      <input type="checkbox" id="togglePronunciation" checked>
    </div>
    <div class="toggle-item">
      <span>한글 번역</span>
      <input type="checkbox" id="toggleTranslation" checked>
    </div>
  </div>

  <!-- 신규: 연음 발음 표기 언어 선택 -->
  <div class="slider-section">
    <div class="slider-header">
      <span>발음 표기 언어 선택</span>
    </div>
    <select id="targetLangSelect" class="lang-select">
      <option value="ko" selected>한글 발음 (Korean)</option>
      <option value="en">영어 발음 (Romaji / English)</option>
      <option value="ja">가타카나 발음 (Katakana)</option>
    </select>
  </div>

  <!-- 자막 크기 조절 슬라이더 -->
  <div class="slider-section">
    <div class="slider-header">
      <span>자막 크기 조절</span>
      <span id="fontSizeVal" style="color: #00a2ff;">25px</span>
    </div>
    <input type="range" id="fontSizeSlider" class="slider-input" min="16" max="40" value="25" step="1">
  </div>

  <!-- 배경 투명도 조절 슬라이더 -->
  <div class="slider-section">
    <div class="slider-header">
      <span>배경 투명도 조절</span>
      <span id="bgOpacityVal" style="color: #00a2ff;">88%</span>
    </div>
    <input type="range" id="bgOpacitySlider" class="slider-input" min="0" max="100" value="88" step="1">
  </div>

  <!-- 파일 다운로드 버튼 영역 -->
  <div class="download-section">
    <button id="downloadMp3Btn" class="download-btn mp3">🎵 MP3 음원 파일 다운로드</button>
    <button id="downloadSrtBtn" class="download-btn">🎬 SRT 자막 파일 다운로드</button>
    <button id="downloadTxtBtn" class="download-btn secondary">📄 TXT 가사 파일 다운로드</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
